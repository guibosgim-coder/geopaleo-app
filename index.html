<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="theme-color" content="#1e1b18">
  <title>GEOPALEO — Cartografía y Campo IGME</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <style>
    :root {
      --bg-dark: #1e1b18;
      --card-bg: #fdfbf7;
      --accent: #b45309;
      --text-main: #292524;
      --text-muted: #57534e;
    }
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html, body {
      margin: 0; padding: 0; height: 100%; width: 100%;
      font-family: system-ui, -apple-system, sans-serif;
      background: var(--bg-dark); overflow: hidden;
    }
    #mapa { position: absolute; top: 0; bottom: 0; left: 0; right: 0; width: 100%; height: 100%; z-index: 1; }

    /* Barra Superior */
    #topbar {
      position: fixed; top: 10px; left: 10px; right: 10px; z-index: 1000;
      display: flex; flex-direction: column; gap: 8px; pointer-events: none;
    }
    .panel-control {
      background: rgba(28, 25, 23, 0.94); backdrop-filter: blur(8px);
      color: #f5f5f4; padding: 10px 14px; border-radius: 14px;
      box-shadow: 0 4px 18px rgba(0,0,0,0.5); pointer-events: auto;
      border: 1px solid rgba(255,255,255,0.12);
    }
    .header-row {
      display: flex; justify-content: space-between; align-items: center; gap: 8px;
    }
    .app-title {
      font-weight: 800; font-size: 13.5px; letter-spacing: 0.4px;
      color: #fbbf24; display: flex; align-items: center; gap: 6px;
    }
    .btn-acciones-top { display: flex; gap: 6px; }
    .btn-gps, .btn-menu-lateral {
      color: #fff; border: none;
      padding: 6px 11px; border-radius: 8px; font-size: 11.5px;
      font-weight: 800; cursor: pointer; white-space: nowrap;
      display: flex; align-items: center; gap: 5px; transition: all 0.2s;
    }
    .btn-gps { background: #0284c7; }
    .btn-gps.buscando { background: #d97706; animation: parpadeo 1s infinite alternate; }
    .btn-gps.activo { background: #15803d; box-shadow: 0 0 10px rgba(21, 128, 61, 0.6); }
    .btn-menu-lateral { background: #57534e; }

    @keyframes parpadeo { from { opacity: 1; } to { opacity: 0.6; } }

    .layer-group { display: flex; gap: 6px; margin-top: 8px; }
    .btn-capa {
      flex: 1; background: #292524; color: #d6d3d1; border: 1px solid #44403c;
      padding: 8px 6px; border-radius: 8px; font-size: 11.5px; font-weight: 600;
      cursor: pointer; text-align: center; transition: all 0.2s;
    }
    .btn-capa.activo {
      background: #fbbf24; color: #1c1917; border-color: #fbbf24; font-weight: 800;
    }
    .opacidad-row {
      display: flex; align-items: center; gap: 8px; margin-top: 8px;
      font-size: 11px; color: #a8a29e;
    }
    .opacidad-row input { flex: 1; accent-color: #fbbf24; cursor: pointer; }

    /* Chips de Eras */
    #barra-eras {
      display: flex; gap: 6px; overflow-x: auto; padding-bottom: 4px;
      scrollbar-width: none; pointer-events: auto;
    }
    #barra-eras::-webkit-scrollbar { display: none; }
    .chip-era {
      padding: 6px 12px; border-radius: 20px; font-size: 11px; font-weight: 800;
      border: 2px solid rgba(255,255,255,0.25); cursor: pointer; white-space: nowrap;
      box-shadow: 0 2px 6px rgba(0,0,0,0.35); transition: transform 0.15s;
    }
    .chip-era.activo { border-color: #ffffff; transform: scale(1.06); }

    /* Marcadores de Yacimientos */
    .marcador-geo {
      width: 28px; height: 28px; border-radius: 50%;
      border: 3px solid #ffffff; box-shadow: 0 2px 8px rgba(0,0,0,0.65);
      display: flex; align-items: center; justify-content: center;
      font-size: 12px; font-weight: 900; color: #1c1917; cursor: pointer;
      transition: transform 0.35s ease, opacity 0.35s ease;
    }
    .siendo-comido {
      transform: scale(0) rotate(720deg) !important;
      opacity: 0;
    }

    /* Marcador SVG Ammonite GPS */
    .marcador-ammonite-gps {
      width: 38px; height: 38px; border-radius: 50%;
      background: #0284c7; border: 2.5px solid #ffffff;
      box-shadow: 0 0 14px rgba(2, 132, 199, 0.95);
      display: flex; align-items: center; justify-content: center;
      animation: pulsoAmmonite 2s infinite;
    }
    @keyframes pulsoAmmonite {
      0% { box-shadow: 0 0 0 0 rgba(2, 132, 199, 0.8); }
      70% { box-shadow: 0 0 0 14px rgba(2, 132, 199, 0); }
      100% { box-shadow: 0 0 0 0 rgba(2, 132, 199, 0); }
    }

    /* Menú Lateral */
    #menu-lateral {
      position: fixed; top: 0; right: -290px; width: 270px; height: 100%;
      background: rgba(28, 25, 23, 0.98); backdrop-filter: blur(10px);
      z-index: 4000; box-shadow: -5px 0 25px rgba(0,0,0,0.5);
      color: #fff; padding: 20px;
      transition: right 0.3s cubic-bezier(0.16, 1, 0.3, 1);
      display: flex; flex-direction: column; gap: 16px;
    }
    #menu-lateral.abierto { right: 0; }
    .menu-header {
      display: flex; justify-content: space-between; align-items: center;
      border-bottom: 1px solid rgba(255,255,255,0.15); padding-bottom: 10px;
    }
    .menu-header h3 { margin: 0; font-size: 16px; color: #fbbf24; }
    .btn-cerrar-menu { background: none; border: none; color: #a8a29e; font-size: 24px; cursor: pointer; }
    .menu-opcion {
      display: flex; align-items: center; justify-content: space-between;
      font-size: 13px; font-weight: 600; color: #e7e5e4;
    }
    .menu-opcion input[type="checkbox"] { width: 18px; height: 18px; accent-color: #fbbf24; cursor: pointer; }

    /* Ficha Inferior de Yacimiento */
    #ficha {
      position: fixed; left: 0; right: 0; bottom: 0; z-index: 2000;
      max-height: 84%; overflow-y: auto;
      background: var(--card-bg); color: var(--text-main);
      padding: 18px 18px 32px 18px;
      border-radius: 22px 22px 0 0;
      box-shadow: 0 -6px 30px rgba(0,0,0,0.5);
      transform: translateY(105%);
      transition: transform 0.32s cubic-bezier(0.16, 1, 0.3, 1);
      border-top: 4px solid var(--accent);
    }
    #ficha.abierta { transform: translateY(0); }
    .tirador { width: 42px; height: 5px; background: #d6d3d1; border-radius: 3px; margin: -6px auto 12px auto; }
    #cerrar {
      float: right; font-size: 22px; line-height: 20px;
      border: none; background: #e7e5e4; color: #44403c;
      width: 34px; height: 34px; border-radius: 50%; cursor: pointer;
    }
    .badge-edad {
      display: inline-block; padding: 4px 10px; border-radius: 6px;
      font-size: 11px; font-weight: 800; text-transform: uppercase;
      margin-bottom: 6px; border: 1px solid rgba(0,0,0,0.15);
    }
    #ficha h2 { margin: 2px 0 6px 0; font-size: 19px; color: #1c1917; padding-right: 40px; }
    .coords-box {
      font-family: monospace; font-size: 11.5px; color: var(--text-muted);
      background: #f5f5f4; padding: 5px 10px; border-radius: 6px;
      margin-bottom: 12px; display: inline-block; border: 1px solid #e7e5e4;
    }
    
    .grid-datos { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 12px; }
    .dato-item { background: #f5f5f4; padding: 8px 10px; border-radius: 10px; border-left: 3px solid #78716
